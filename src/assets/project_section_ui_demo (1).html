<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio UI Demo (Projects + Skills)</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
    body{background:#0f172a;color:#fff;padding:40px}
    h1{margin:30px 0 20px}

    /* ---------- COMMON ---------- */
    .scroll-x{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px}
    .scroll-x::-webkit-scrollbar{height:6px}
    .scroll-x::-webkit-scrollbar-thumb{background:#555;border-radius:10px}

    /* ---------- PROJECT SECTION (same as before) ---------- */
    .glass{background:rgba(255,255,255,0.05);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);padding:20px;border-radius:15px;width:260px;flex-shrink:0}
    .glass img{width:100%;border-radius:10px;margin-bottom:10px}

    .card{position:relative;width:260px;overflow:hidden;border-radius:15px;flex-shrink:0}
    .card img{width:100%;transition:.4s}
    .card:hover img{transform:scale(1.1)}
    .overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;justify-content:center;align-items:center;flex-direction:column;opacity:0;transition:.4s}
    .card:hover .overlay{opacity:1}
    .btn{margin-top:10px;padding:8px 15px;background:#fff;color:#000;border:none;border-radius:5px;cursor:pointer}

    .split{display:flex;width:450px;background:#1e293b;border-radius:15px;overflow:hidden;flex-shrink:0}
    .split img{width:50%;object-fit:cover}
    .split .content{padding:15px}

    .tilt{width:260px;background:#1e293b;padding:15px;border-radius:15px;transition:.3s;flex-shrink:0}
    .tilt:hover{transform:rotateX(5deg) rotateY(5deg)}
    .tilt img{width:100%;border-radius:10px;margin-bottom:10px}

    .gradient{width:260px;padding:15px;border-radius:15px;background:linear-gradient(135deg,#6366f1,#ec4899);flex-shrink:0}
    .gradient img{width:100%;border-radius:10px;margin-bottom:10px}

    .featured{width:350px;background:#020617;padding:20px;border-radius:15px;border:1px solid purple;flex-shrink:0}
    .featured img{width:100%;border-radius:10px;margin-bottom:10px}

    /* ---------- SKILL SECTION ---------- */

    /* Category Card */
    .skill-category{background:#1e293b;padding:20px;border-radius:15px;width:260px;flex-shrink:0}
    .skill-category h3{margin-bottom:10px}

    /* Skill item */
    .skill{margin-bottom:15px}

    /* Progress bar */
    .bar{height:8px;background:#334155;border-radius:10px;overflow:hidden}
    .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#4ade80);transition:1s}

    /* Hover skill card */
    .skill-card{background:#1e293b;padding:15px;border-radius:12px;width:200px;transition:.3s;flex-shrink:0}
    .skill-card:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(0,0,0,.4)}

    /* Marquee */
    .marquee{display:flex;gap:30px;animation:scroll 10s linear infinite}
    .marquee span{background:#1e293b;padding:10px 20px;border-radius:20px}

    @keyframes scroll{
      0%{transform:translateX(0)}
      100%{transform:translateX(-50%)}
    }

    /* Tabs */
    .tabs{display:flex;gap:10px;margin-bottom:15px}
    .tab{padding:8px 15px;background:#1e293b;border-radius:20px;cursor:pointer}

  </style>
</head>
<body>

  <h1>Project Section</h1>
  <div class="scroll-x">
    <div class="glass">
      <img src="https://picsum.photos/300/200">
      <h3>Glass Card</h3>
    </div>

    <div class="card">
      <img src="https://picsum.photos/300/200?2">
      <div class="overlay">
        <h3>Overlay</h3>
        <button class="btn">View</button>
      </div>
    </div>

    <div class="split">
      <img src="https://picsum.photos/200/200?3">
      <div class="content"><h3>Split</h3></div>
    </div>

    <div class="tilt">
      <img src="https://picsum.photos/300/200?4">
      <h3>Tilt</h3>
    </div>

    <div class="gradient">
      <img src="https://picsum.photos/300/200?5">
      <h3>Gradient</h3>
    </div>

    <div class="featured">
      <img src="https://picsum.photos/400/250?6">
      <h2>Featured ⭐</h2>
    </div>
  </div>


  <h1>Skill Section</h1>

  <!-- Categories with bars -->
  <div class="scroll-x">
    <div class="skill-category">
      <h3>Frontend</h3>
      <div class="skill">
        <p>React</p>
        <div class="bar"><span style="width:80%"></span></div>
      </div>
      <div class="skill">
        <p>JavaScript</p>
        <div class="bar"><span style="width:75%"></span></div>
      </div>
    </div>

    <div class="skill-category">
      <h3>Backend</h3>
      <div class="skill">
        <p>Node</p>
        <div class="bar"><span style="width:70%"></span></div>
      </div>
    </div>
  </div>

  <!-- Hover Cards -->
  <h1>Skill Cards</h1>
  <div class="scroll-x">
    <div class="skill-card">
      <h3>React</h3>
      <p>10+ projects</p>
    </div>

    <div class="skill-card">
      <h3>JS</h3>
      <p>Strong logic</p>
    </div>
  </div>

  <!-- Marquee -->
  <h1>Tech Slider</h1>
  <div class="marquee">
    <span>React</span>
    <span>JS</span>
    <span>Node</span>
    <span>Tailwind</span>
    <span>Git</span>
  </div>

  <!-- Tabs -->
  <h1>Tabs Idea</h1>
  <div class="tabs">
    <div class="tab">Frontend</div>
    <div class="tab">Backend</div>
    <div class="tab">Tools</div>
  </div>

</body>
</html>
